<nav class="navbar">
  <a routerLink="/" class="logo" (click)="closeMenu()">🔥 Asadero Con Afán</a>
  <button
    class="hamburguesa"
    [class.abierto]="menuAbierto"
    [attr.aria-expanded]="menuAbierto"
    aria-label="Abrir menú"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" [class.abierto]="menuAbierto">
    <li><a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a></li>
    <li><a routerLink="/menu" routerLinkActive="activo" (click)="closeMenu()">Menú</a></li>
    <li><a routerLink="/equipo" routerLinkActive="activo" (click)="closeMenu()">Nuestro equipo</a></li>
    <li><a routerLink="/unete" routerLinkActive="activo" (click)="closeMenu()">Únete & Opiniones</a></li>
    <li><a routerLink="/checkout" routerLinkActive="activo" (click)="closeMenu()">Carrito</a></li>
  </ul>
</nav>
<div class="nav-overlay" [class.visible]="menuAbierto" (click)="closeMenu()"></div>
<router-outlet />
<a
  [href]="whatsappUrl"
  class="whatsapp-flotante"

  rel="noopener noreferrer"
